  data.forEach(function(d) {
    var k = keyFn(d);
    if (!groups[k]) groups[k] = { o: d.open, h: d.high, l: d.low, c: d.close, v: d.volume, n: 1, firstDay: d.day };
    else {
      if (d.high > groups[k].h) groups[k].h = d.high;
      if (d.low < groups[k].l) groups[k].l = d.low;
      groups[k].c = d.close;
      groups[k].v += d.volume;
      groups[k].n++;
    }
  });
  return groups;
}

function getPeriodData(period) {
  if (period === 'daily') return KLINE_DATA.map(function(d){ return { o:d.open, h:d.high, l:d.low, c:d.close, v:d.volume, day:d.day }; });
  var lastIdx = {};
  if (period === 'weekly') {
    var grouped = aggregateBy(KLINE_DATA, function(d){ return getISOWeek(d.day); });
    var result = [];
    for (var k in grouped) result.push(grouped[k]);
    result.sort(function(a,b){ return a.firstDay < b.firstDay ? -1 : 1; });
    return result;
  }
  if (period === 'monthly') {
    var grouped = aggregateBy(KLINE_DATA, function(d){ return d.day.substring(0,7); });
    var result = [];
    for (var k in grouped) result.push(grouped[k]);
    result.sort(function(a,b){ return a.firstDay < b.firstDay ? -1 : 1; });
    return result;
  }
  return KLINE_DATA;
}

// ============================================================
//  渲染 K 线
// ============================================================
function renderKLine(period) {
  var allData = getPeriodData(period);
  var maxBars = 72;
  var data = allData.slice(-maxBars);
  var el = document.getElementById('klineChart'), W = 720, H = 380;
  var cH = H * 0.72, vH = H * 0.22, pt = 16, pr = 20, pb = 4, pl = 52;
  var iw = W - pl - pr, ih = cH - pt - pb;

  var minP = Infinity, maxP = -Infinity, minV = Infinity, maxV = -Infinity;
  data.forEach(function(d){
    if (d.l < minP) minP = d.l;
    if (d.h > maxP) maxP = d.h;
    if (d.v < minV) minV = d.v;
    if (d.v > maxV) maxV = d.v;
  });
  var padP = (maxP - minP) * 0.06 || 1; minP -= padP; maxP += padP;

  var closes = data.map(function(d){ return d.c; });
  var vols = data.map(function(d){ return d.v; });
  var ma5 = calcMA(closes, 5);
  var ma10 = calcMA(closes, 10);
  var ma20 = calcMA(closes, 20);

  var cw = Math.max(2, iw / data.length - 1);
  var toX = function(i) { return pl + i * (cw + 1) + cw / 2; };
  var toY = function(v) { return pt + ih - ((v - minP) / (maxP - minP)) * ih; };
  var toVolY = function(v) { return cH + vH - ((v - minV) / (maxV - minV || 1)) * vH; };

  var periodLabel = { daily: '日K', weekly: '周K', monthly: '月K' }[period] || 'K';
  document.getElementById('klineSub').textContent = '紫金矿业 sh601899 · ' + periodLabel + ' · MA5/10/20 · ' + data.length + ' 条';

  var s = '';
  [0, 0.25, 0.5, 0.75, 1].forEach(function(r) {
    var y = pt + ih * (1 - r);
    s += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="' + GRID + '" stroke-width="0.5"/>';
    s += '<text x="' + (pl - 8) + '" y="' + (y + 3) + '" text-anchor="end" font-size="9" fill="' + TX3 + '">' + (minP + (maxP - minP) * r).toFixed(2) + '</text>';
  });

  data.forEach(function(d, i) {
    var x = toX(i), isUp = d.c >= d.o, c = isUp ? UP : DN;
    s += '<line x1="' + x + '" y1="' + toY(d.h) + '" x2="' + x + '" y2="' + toY(d.l) + '" stroke="' + c + '" stroke-width="1"/>';
    s += '<rect x="' + (x - cw / 2) + '" y="' + toY(Math.max(d.o, d.c)) + '" width="' + cw + '" height="' + Math.max(1, Math.abs(toY(d.o) - toY(d.c))) + '" fill="' + c + '"/>';
    var volC = isUp ? 'rgba(239,83,80,0.4)' : 'rgba(38,166,154,0.4)';
    s += '<rect x="' + (x - cw / 2) + '" y="' + toVolY(d.v) + '" width="' + cw + '" height="' + Math.max(1, toVolY(0) - toVolY(d.v)) + '" fill="' + volC + '"/>';
  });

  [[ma5, MA5, ''], [ma10, MA10, '3,2'], [ma20, MA20, '4,3']].forEach(function(ln) {
    var pts = [];
    ln[0].forEach(function(v, i) { if (!isNaN(v)) pts.push(toX(i) + ',' + toY(v)); });
    if (pts.length) s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + ln[1] + '" stroke-width="1" stroke-dasharray="' + ln[2] + '"/>';
  });

  el.innerHTML = s;
}

// ============================================================
//  渲染分时图
// ============================================================
function renderTimeShare() {
  var data = INTRADAY;
  var el = document.getElementById('tsChart'), W = 720, H = 320;
  var cH = H * 0.76, vH = H * 0.18, pt = 16, pr = 20, pb = 28, pl = 52;
  var iw = W - pl - pr, ih = cH - pt - pb;

  var minP = Infinity, maxP = -Infinity, maxV = -Infinity;
  data.forEach(function(d) {
    if (d.p < minP) minP = d.p;
    if (d.p > maxP) maxP = d.p;
    if (d.v > maxV) maxV = d.v;
  });
  var padP = (maxP - minP) * 0.12 || 1; minP -= padP; maxP += padP;

  var s = '';

  // 中间线（昨收参考线）
  var prevClose = 28.83;
  var midY = pt + ih - ((prevClose - minP) / (maxP - minP)) * ih;
  s += '<line x1="' + pl + '" y1="' + midY + '" x2="' + (W - pr) + '" y2="' + midY + '" stroke="' + GRID + '" stroke-width="0.5" stroke-dasharray="4,3"/>';

  // 价格刻度
  [0, 0.25, 0.5, 0.75, 1].forEach(function(r) {
    var y = pt + ih * (1 - r);
    s += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="' + GRID + '" stroke-width="0.5"/>';
    s += '<text x="' + (pl - 8) + '" y="' + (y + 3) + '" text-anchor="end" font-size="9" fill="' + TX3 + '">' + (minP + (maxP - minP) * r).toFixed(2) + '</text>';
  });

  // 成交量柱（灰色，A股规范）
  data.forEach(function(d, i) {
    var x = pl + (i / (data.length - 1)) * iw;
    var bw = Math.max(1, iw / data.length - 1);
    var bh = (d.v / maxV) * vH;
    s += '<rect x="' + (x - bw / 2) + '" y="' + (cH + vH - bh) + '" width="' + bw + '" height="' + bh + '" fill="rgba(160,160,168,0.35)"/>';
  });

  // 价格线（白色）
  var pricePts = data.map(function(d, i) {
    var x = pl + (i / (data.length - 1)) * iw;
    var y = pt + ih - ((d.p - minP) / (maxP - minP)) * ih;
    return x + ',' + y;
  }).join(' ');
  s += '<polyline points="' + pricePts + '" fill="none" stroke="#ffffff" stroke-width="1.5"/>';

  // 均价线（黄色）
  var avgPts = data.map(function(d, i) {
    var x = pl + (i / (data.length - 1)) * iw;
    var y = pt + ih - ((d.avg - minP) / (maxP - minP)) * ih;
    return x + ',' + y;
  }).join(' ');
  s += '<polyline points="' + avgPts + '" fill="none" stroke="#fdd835" stroke-width="1" stroke-dasharray="3,2"/>';

  // 时间轴标签
  var timeLabels = ['09:30','10:00','10:30','11:00','11:30','13:30','14:00','14:30','15:00'];
  timeLabels.forEach(function(t) {
    for (var i = 0; i < data.length; i++) {
      if (data[i].t === t || (i === 0 && t === '09:30') || (i === data.length - 1 && t === '15:00')) {
        var x = pl + (i / (data.length - 1)) * iw;
        s += '<text x="' + x + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9" fill="' + TX3 + '">' + t + '</text>';
        break;
      }
    }
  });

  el.innerHTML = s;
}

function renderDepth() {
  var bidLevels = [
    {p:28.90,v:500},{p:28.92,v:800},{p:28.94,v:1200},{p:28.96,v:600},{p:28.98,v:1500},
    {p:29.00,v:900},{p:29.02,v:1100},{p:29.04,v:700},{p:29.06,v:1300},{p:29.08,v:850},
    {p:29.10,v:600},{p:29.12,v:1100},{p:29.14,v:400},{p:29.16,v:900},{p:29.18,v:1200}
  ];
  var askLevels = [
    {p:29.28,v:452},{p:29.27,v:213},{p:29.26,v:944},{p:29.25,v:2841},{p:29.24,v:1062},
    {p:29.23,v:908},{p:29.22,v:780},{p:29.21,v:1665},{p:29.20,v:1625},
    {p:29.30,v:700},{p:29.32,v:500},{p:29.34,v:800},{p:29.36,v:600},{p:29.38,v:1000},
    {p:29.40,v:1200}
  ];
  var el = document.getElementById('depthChart'), W = 520, H = 300, pt = 16, pr = 20, pb = 28, pl = 52;
  var iw = W - pl - pr, ih = H - pt - pb;

  var bidCum = 0, bidPts = [];
  [].concat(bidLevels).sort(function(a,b){return b.p - a.p}).forEach(function(d){ bidCum += d.v; bidPts.push({p:d.p, v:bidCum}); });

  var askCum = 0, askPts = [];
  [].concat(askLevels).sort(function(a,b){return a.p - b.p}).forEach(function(d){ askCum += d.v; askPts.push({p:d.p, v:askCum}); });

  var all = bidLevels.concat(askLevels);
  var minP = all.reduce(function(a,b){return Math.min(a,b.p)}, Infinity);
  var maxP = all.reduce(function(a,b){return Math.max(a,b.p)}, -Infinity);
  var padP = (maxP - minP) * 0.02; minP -= padP; maxP += padP;
  var maxV = Math.max(bidCum, askCum) * 1.1;

  var sx = function(p) { return pl + ((p - minP) / (maxP - minP || 1)) * iw; };
  var sy = function(v) { return pt + ih - (v / maxV) * ih; };

  var s = '';
  [0, 0.5, 1].forEach(function(r) {
    var y = pt + ih * (1 - r);
    s += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="' + GRID + '" stroke-width="0.5"/>';
    s += '<text x="' + (pl - 8) + '" y="' + (y + 3) + '" text-anchor="end" font-size="9" fill="' + TX3 + '">' + (maxV * r).toFixed(0) + '</text>';
  });

  // 买盘（绿/蓝色系）
  var bidStr = sx(bidPts[0].p) + ',' + sy(0) + ' ' + bidPts.map(function(d){ return sx(d.p) + ',' + sy(d.v); }).join(' ') + ' ' + sx(bidPts[bidPts.length-1].p) + ',' + sy(0);
  s += '<polygon points="' + bidStr + '" fill="rgba(38,166,154,0.25)"/>';
  s += '<polyline points="' + bidStr + '" fill="none" stroke="' + DN + '" stroke-width="1.5"/>';

  // 卖盘（红）
  var askStr = sx(askPts[0].p) + ',' + sy(0) + ' ' + askPts.map(function(d){ return sx(d.p) + ',' + sy(d.v); }).join(' ') + ' ' + sx(askPts[askPts.length-1].p) + ',' + sy(0);
  s += '<polygon points="' + askStr + '" fill="rgba(239,83,80,0.25)"/>';
  s += '<polyline points="' + askStr + '" fill="none" stroke="' + UP + '" stroke-width="1.5"/>';

  // 价格标签
  [minP, (minP+maxP)/2, maxP].forEach(function(p, i) {
    s += '<text x="' + sx(p) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="9" fill="' + TX3 + '">' + p.toFixed(2) + '</text>';
  });

  var mid = (bidPts[0].p + askPts[0].p) / 2;
  s += '<line x1="' + sx(mid) + '" y1="' + pt + '" x2="' + sx(mid) + '" y2="' + (pt + ih) + '" stroke="' + ACC + '" stroke-width="1" stroke-dasharray="3,3"/>';
  s += '<text x="' + sx(mid) + '" y="' + (pt - 6) + '" text-anchor="middle" font-size="9" fill="' + ACC + '">' + mid.toFixed(2) + '</text>';

  el.innerHTML = s;
}

function renderTopInfo() {
  var last = KLINE_DATA[KLINE_DATA.length - 1];
  var prev = KLINE_DATA[KLINE_DATA.length - 2];
  var chg = (last.close - prev.close);
  var pct = (chg / prev.close * 100);
  var cls = chg >= 0 ? 'up' : 'dn';
  document.getElementById('topPrice').textContent = last.close.toFixed(2);
  document.getElementById('topPrice').className = 'price ' + cls;
  document.getElementById('topChg').textContent = (chg > 0 ? '+' : '') + chg.toFixed(2) + ' ' + (pct > 0 ? '+' : '') + pct.toFixed(2) + '%';
  document.getElementById('topChg').className = 'chg ' + cls;
  document.getElementById('topMeta').textContent = '高 ' + last.high.toFixed(2) + '  低 ' + last.low.toFixed(2) + '  开 ' + last.open.toFixed(2) + '  昨收 ' + prev.close.toFixed(2) + '  量 ' + (last.volume/100000000).toFixed(2) + '亿  额 ' + (last.volume * last.close / 100000000).toFixed(0) + '亿';
}
