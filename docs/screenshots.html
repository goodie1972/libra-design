<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libra Design — 组件渲染页</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--up:#ef5350;--down:#26a69a;--up-bg:rgba(239,83,80,.08);--down-bg:rgba(38,166,154,.08);--ma5:#f8b500;--ma10:#4a6cf7;--ma20:#9c27b0;--vol-up:rgba(239,83,80,.4);--vol-down:rgba(38,166,154,.4);--bg-root:#0c0c0e;--bg-main:#0c0c0e;--bg-card:#151518;--bg-card-hover:#1c1c20;--bg-input:#1c1c20;--bg-chart:#0c0c0e;--border-main:#252528;--border-sub:#1c1c20;--text-primary:#e8e8ed;--text-secondary:#c8c8d0;--text-tertiary:#a0a0a8;--accent:#f59e0b;--grid-line:#1a1a1e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg-root);color:var(--text-primary);font-family:'Inter',sans-serif;padding:24px}
.section{background:var(--bg-card);border:1px solid var(--border-main);border-radius:10px;margin-bottom:32px;overflow:hidden}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border-sub)}
.sh h2{font-size:15px;font-weight:600}
.sh span{font-size:11px;color:var(--text-tertiary);font-family:'JetBrains Mono',monospace}
.sb{padding:20px}
svg{display:block;margin:0 auto}
</style>
</head>
<body>

<div class="section" id="kline-section">
  <div class="sh"><h2>KLineChart · K 线图</h2><span>紫金矿业 sh601899 · 30 根日K · OHLCV + MA5/MA10/MA20</span></div>
  <div class="sb"><svg id="klineChart" width="720" height="380" xmlns="http://www.w3.org/2000/svg"></svg></div>
</div>

<div class="section" id="timeshare-section">
  <div class="sh"><h2>TimeShareChart · 分时图</h2><span>紫金矿业 · 日内走势 + 均价线 + 成交量</span></div>
  <div class="sb"><svg id="tsChart" width="720" height="320" xmlns="http://www.w3.org/2000/svg"></svg></div>
</div>

<div class="section" id="depth-section">
  <div class="sh"><h2>DepthChart · 深度图</h2><span>买卖盘累积深度曲线</span></div>
  <div class="sb"><svg id="depthChart" width="520" height="300" xmlns="http://www.w3.org/2000/svg"></svg></div>
</div>

<div class="section" id="stocktable-section">
  <div class="sh"><h2>StockTable · 行情表格</h2><span>可排序 · 列固定 · 列宽拖拽 · 虚拟滚动</span></div>
  <div class="sb" style="overflow-x:auto"><table id="stockTable" style="width:100%;border-collapse:collapse;font-size:13px"></table></div>
</div>

<div class="section" id="badge-section">
  <div class="sh"><h2>Badge · PriceDisplay · StockCard</h2><span>金融级涨跌展示</span></div>
  <div class="sb" style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
    <span id="badge1"></span>
    <span id="badge2"></span>
    <span id="badge3"></span>
    <div id="pricedisplay1"></div>
    <div id="stockcard1"></div>
    <div id="stockcard2"></div>
  </div>
</div>

<script>
// 所有渲染函数 — 外部通过 renderAll() 调用
function renderAll() {
  var UP='#ef5350',DN='#26a69a',MA5='#f8b500',MA10='#4a6cf7',MA20='#9c27b0',GRID='#1a1a1e',TX3='#a0a0a8',ACC='#f59e0b';

  // ============ KLINE: 紫金矿业 30日K ============
  (function(){
    var kdata=[
      {o:15.20,h:15.45,l:15.10,c:15.35,v:1850000},{o:15.35,h:15.58,l:15.22,c:15.50,v:2100000},
      {o:15.50,h:15.62,l:15.30,c:15.32,v:1950000},{o:15.32,h:15.42,l:15.05,c:15.12,v:2500000},
      {o:15.12,h:15.28,l:15.00,c:15.20,v:2200000},{o:15.20,h:15.35,l:15.08,c:15.28,v:1800000},
      {o:15.28,h:15.52,l:15.18,c:15.48,v:2400000},{o:15.48,h:15.65,l:15.40,c:15.42,v:1950000},
      {o:15.42,h:15.50,l:15.15,c:15.18,v:2650000},{o:15.18,h:15.22,l:14.95,c:15.05,v:3100000},
      {o:15.05,h:15.18,l:14.88,c:15.10,v:2800000},{o:15.10,h:15.30,l:15.02,c:15.25,v:2050000},
      {o:15.25,h:15.40,l:15.12,c:15.35,v:1750000},{o:15.35,h:15.55,l:15.28,c:15.52,v:2300000},
      {o:15.52,h:15.68,l:15.42,c:15.60,v:2600000},{o:15.60,h:15.75,l:15.50,c:15.72,v:2900000},
      {o:15.72,h:15.80,l:15.55,c:15.58,v:2150000},{o:15.58,h:15.62,l:15.35,c:15.38,v:2000000},
      {o:15.38,h:15.45,l:15.20,c:15.28,v:1850000},{o:15.28,h:15.50,l:15.22,c:15.45,v:2300000},
      {o:15.45,h:15.60,l:15.35,c:15.55,v:1750000},{o:15.55,h:15.70,l:15.48,c:15.65,v:2100000},
      {o:15.65,h:15.78,l:15.52,c:15.70,v:2450000},{o:15.70,h:15.82,l:15.60,c:15.75,v:2200000},
      {o:15.75,h:15.88,l:15.58,c:15.62,v:2600000},{o:15.62,h:15.72,l:15.42,c:15.48,v:1900000},
      {o:15.48,h:15.55,l:15.25,c:15.32,v:2250000},{o:15.32,h:15.48,l:15.18,c:15.42,v:2400000},
      {o:15.42,h:15.52,l:15.30,c:15.35,v:1800000},{o:15.35,h:15.48,l:15.20,c:15.28,v:2050000}
    ];
    var el=document.getElementById('klineChart'),W=720,H=380;
    var cH=H*0.72,vH=H*0.22,pt=16,pr=20,pb=4,pl=52;
    var iw=W-pl-pr,ih=cH-pt-pb;
    var minP=Infinity,maxP=-Infinity,minV=Infinity,maxV=-Infinity;
    kdata.forEach(function(d){if(d.l<minP)minP=d.l;if(d.h>maxP)maxP=d.h;if(d.v<minV)minV=d.v;if(d.v>maxV)maxV=d.v});
    var padP=(maxP-minP)*0.06||1;minP-=padP;maxP+=padP;
    function ma(arr,win){var r=[];for(var i=0;i<arr.length;i++){var s=arr.slice(Math.max(0,i-win+1),i+1);r.push(s.reduce(function(a,b){return a+b},0)/s.length)}return r}
    var closes=kdata.map(function(d){return d.c});
    var ma5=ma(closes,5),ma10=ma(closes,10),ma20=ma(closes,20);
    var cw=Math.max(2,iw/kdata.length-1);
    var toX=function(i){return pl+i*(cw+1)+cw/2};
    var toY=function(v){return pt+ih-((v-minP)/(maxP-minP))*ih};
    var toVolY=function(v){return cH+vH-((v-minV)/(maxV-minV||1))*vH};
    var s='<title>KLineChart</title>';
    [0,0.25,0.5,0.75,1].forEach(function(r){
      var y=pt+ih*(1-r);s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="'+GRID+'" stroke-width="0.5"/>';
      s+='<text x="'+(pl-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="'+TX3+'">'+(minP+(maxP-minP)*r).toFixed(2)+'</text>'});
    kdata.forEach(function(d,i){
      var x=toX(i),isUp=d.c>=d.o,c=isUp?UP:DN;
      s+='<line x1="'+x+'" y1="'+toY(d.h)+'" x2="'+x+'" y2="'+toY(d.l)+'" stroke="'+c+'" stroke-width="1"/>';
      s+='<rect x="'+(x-cw/2)+'" y="'+toY(Math.max(d.o,d.c))+'" width="'+cw+'" height="'+Math.max(1,Math.abs(toY(d.o)-toY(d.c)))+'" fill="'+c+'"/>';
      s+='<rect x="'+(x-cw/2)+'" y="'+toVolY(d.v)+'" width="'+cw+'" height="'+Math.max(1,toVolY(0)-toVolY(d.v))+'" fill="'+(isUp?'rgba(239,83,80,0.4)':'rgba(38,166,154,0.4)')+'"/>'});
    [[ma5,MA5,''],[ma10,MA10,'3,2'],[ma20,MA20,'4,3']].forEach(function(ln){
      var pts=[];ln[0].forEach(function(v,i){if(!isNaN(v))pts.push(toX(i)+','+toY(v))});
      if(pts.length)s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+ln[1]+'" stroke-width="1" stroke-dasharray="'+ln[2]+'"/>'});
    el.innerHTML=s;
  })();

  // ============ TIMESHARE: 紫金矿业日内 ============
  (function(){
    var tsdata=[
      {t:'09:30',p:15.38,v:1850000,avg:15.38},{t:'09:40',p:15.42,v:2100000,avg:15.40},
      {t:'09:50',p:15.35,v:1950000,avg:15.38},{t:'10:00',p:15.28,v:2500000,avg:15.36},
      {t:'10:10',p:15.32,v:2200000,avg:15.35},{t:'10:20',p:15.40,v:1800000,avg:15.36},
      {t:'10:30',p:15.45,v:2400000,avg:15.37},{t:'10:40',p:15.50,v:1950000,avg:15.39},
      {t:'10:50',p:15.42,v:2650000,avg:15.39},{t:'11:00',p:15.35,v:3100000,avg:15.39},
      {t:'11:10',p:15.30,v:2800000,avg:15.38},{t:'11:20',p:15.25,v:2050000,avg:15.37},
      {t:'13:00',p:15.18,v:2300000,avg:15.35},{t:'13:10',p:15.22,v:2600000,avg:15.34},
      {t:'13:20',p:15.28,v:2900000,avg:15.34},{t:'13:30',p:15.35,v:1800000,avg:15.34},
      {t:'13:40',p:15.40,v:2200000,avg:15.35},{t:'13:50',p:15.38,v:1950000,avg:15.35},
      {t:'14:00',p:15.42,v:2400000,avg:15.35},{t:'14:10',p:15.48,v:2300000,avg:15.36},
      {t:'14:20',p:15.45,v:2100000,avg:15.36},{t:'14:30',p:15.52,v:2600000,avg:15.37},
      {t:'14:40',p:15.48,v:2150000,avg:15.37},{t:'14:50',p:15.55,v:2500000,avg:15.38},
      {t:'15:00',p:15.50,v:1900000,avg:15.38}
    ];
    var el=document.getElementById('tsChart'),W=720,H=320;
    var cH=H*0.76,vH=H*0.18,pt=16,pr=20,pb=28,pl=52;
    var iw=W-pl-pr,ih=cH-pt-pb;
    var minP=Infinity,maxP=-Infinity,maxV=-Infinity;
    tsdata.forEach(function(d){if(d.p<minP)minP=d.p;if(d.p>maxP)maxP=d.p;if(d.v>maxV)maxV=d.v});
    var padP=(maxP-minP)*0.12||1;minP-=padP;maxP+=padP;
    var s='<title>TimeShareChart</title>';
    // mid line
    s+='<line x1="'+pl+'" y1="'+(pt+ih/2)+'" x2="'+(W-pr)+'" y2="'+(pt+ih/2)+'" stroke="'+GRID+'" stroke-width="0.5" stroke-dasharray="4,3"/>';
    [0,0.5,1].forEach(function(r){
      var y=pt+ih*(1-r);s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="'+GRID+'" stroke-width="0.5"/>';
      s+='<text x="'+(pl-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="'+TX3+'">'+(minP+(maxP-minP)*r).toFixed(2)+'</text>'});
    // vol bars
    tsdata.forEach(function(d,i){
      var x=pl+(i/(tsdata.length-1))*iw,bw=Math.max(1,iw/tsdata.length-1),bh=(d.v/maxV)*vH;
      s+='<rect x="'+(x-bw/2)+'" y="'+(cH+vH-bh)+'" width="'+bw+'" height="'+bh+'" fill="rgba(239,83,80,0.4)"/>'});
    // price line
    var pts=tsdata.map(function(d,i){var x=pl+(i/(tsdata.length-1))*iw,y=pt+ih-((d.p-minP)/(maxP-minP))*ih;return x+','+y}).join(' ');
    s+='<polyline points="'+pts+'" fill="none" stroke="'+ACC+'" stroke-width="1.5"/>';
    // avg line
    tsdata.forEach(function(d,i){var x=pl+(i/(tsdata.length-1))*iw,y=pt+ih-((d.avg-minP)/(maxP-minP))*ih;s+='<circle cx="'+x+'" cy="'+y+'" r="0.5" fill="'+TX3+'" opacity="0.5"/>'});
    el.innerHTML=s;
  })();

  // ============ DEPTH ============
  (function(){
    var dbids=[{p:15.42,v:500},{p:15.40,v:800},{p:15.38,v:1200},{p:15.36,v:600},{p:15.34,v:1500},{p:15.32,v:900},{p:15.30,v:1100}];
    var dasks=[{p:15.44,v:700},{p:15.46,v:1000},{p:15.48,v:450},{p:15.50,v:1300},{p:15.52,v:850},{p:15.54,v:600},{p:15.56,v:1100}];
    var el=document.getElementById('depthChart'),W=520,H=300,pt=16,pr=20,pb=28,pl=52,iw=W-pl-pr,ih=H-pt-pb;
    var all=[].concat(dbids,dasks);
    var cumBid=0,bidPts=[];[].concat(dbids).sort(function(a,b){return b.p-a.p}).forEach(function(d){cumBid+=d.v;bidPts.push({p:d.p,v:cumBid})});
    var cumAsk=0,askPts=[];[].concat(dasks).sort(function(a,b){return a.p-b.p}).forEach(function(d){cumAsk+=d.v;askPts.push({p:d.p,v:cumAsk})});
    var minP=all.reduce(function(a,b){return Math.min(a,b.p)},Infinity)*0.999;
    var maxP=all.reduce(function(a,b){return Math.max(a,b.p)},-Infinity)*1.001;
    var maxV=Math.max(cumBid,cumAsk)*1.1;
    var sx=function(p){return pl+((p-minP)/(maxP-minP||1))*iw};
    var sy=function(v){return pt+ih-(v/maxV)*ih};
    var bidStr='0,'+sy(0)+' '+bidPts.map(function(d){return sx(d.p)+','+sy(d.v)}).join(' ')+' '+sx(bidPts[bidPts.length-1].p)+','+sy(0);
    var askStr=sx(askPts[0].p)+','+sy(0)+' '+askPts.map(function(d){return sx(d.p)+','+sy(d.v)}).join(' ')+' '+sx(askPts[askPts.length-1].p)+','+sy(0);
    var s='<title>DepthChart</title>';
    [0,0.5,1].forEach(function(r){var y=pt+ih*(1-r);s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="'+GRID+'" stroke-width="0.5"/><text x="'+(pl-8)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="'+TX3+'">'+(maxV*r).toFixed(0)+'</text>'});
    s+='<polygon points="'+bidStr+'" fill="rgba(239,83,80,0.25)"/><polyline points="'+bidStr+'" fill="none" stroke="'+UP+'" stroke-width="1.5"/>';
    s+='<polygon points="'+askStr+'" fill="rgba(38,166,154,0.25)"/><polyline points="'+askStr+'" fill="none" stroke="'+DN+'" stroke-width="1.5"/>';
    [minP,(minP+maxP)/2,maxP].forEach(function(p,i){s+='<text x="'+sx(p)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="'+TX3+'">'+p.toFixed(2)+'</text>'});
    // price marker
    var mid=(bidPts[0].p+askPts[0].p)/2;
    s+='<line x1="'+sx(mid)+'" y1="'+pt+'" x2="'+sx(mid)+'" y2="'+(pt+ih)+'" stroke="'+ACC+'" stroke-width="1" stroke-dasharray="3,3"/>';
    s+='<text x="'+sx(mid)+'" y="'+(pt-6)+'" text-anchor="middle" font-size="9" fill="'+ACC+'">'+mid.toFixed(2)+'</text>';
    el.innerHTML=s;
  })();

  // ============ STOCK TABLE ============
  (function(){
    var el=document.getElementById('stockTable');
    var cols=[
      {k:'code',l:'代码',w:100},{k:'name',l:'名称',w:120},{k:'price',l:'最新价',w:110,a:'r'},{k:'change',l:'涨跌额',w:100,a:'r'},
      {k:'cp',l:'涨跌幅',w:100,a:'r'},{k:'volume',l:'成交量',w:110,a:'r'},{k:'turnover',l:'成交额',w:110,a:'r'}
    ];
    var rows=[
      {code:'sh601899',name:'紫金矿业',price:15.50,change:0.28,cp:1.84,volume:'2.56亿',turnover:'3.97亿'},
      {code:'sh600519',name:'贵州茅台',price:1689.50,change:-15.20,cp:-0.89,volume:'1.23亿',turnover:'207.91亿'},
      {code:'sz000858',name:'五粮液',price:142.80,change:-1.94,cp:-1.34,volume:'4.10亿',turnover:'5.85亿'},
      {code:'sh601398',name:'工商银行',price:5.89,change:0.03,cp:0.51,volume:'7.33亿',turnover:'4.32亿'},
      {code:'sz300750',name:'宁德时代',price:196.35,change:-5.80,cp:-2.87,volume:'10.25亿',turnover:'20.13亿'},
      {code:'sz002594',name:'比亚迪',price:287.60,change:1.82,cp:0.64,volume:'8.91亿',turnover:'25.62亿'},
      {code:'sh601166',name:'兴业银行',price:18.42,change:-0.21,cp:-1.13,volume:'2.15亿',turnover:'3.97亿'},
    ];
    var h='<thead><tr>';
    cols.forEach(function(c){
      h+='<th style="padding:8px 12px;font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.05em;text-align:'+(c.a||'l')+';border-bottom:1px solid var(--border-sub);font-weight:500;white-space:nowrap">'+c.l+'</th>'});
    h+='</tr></thead><tbody>';
    rows.forEach(function(r){
      h+='<tr style="border-bottom:1px solid var(--border-sub)">';
      cols.forEach(function(c){
        var val=r[c.k];var cl='';
        if(c.k==='price')val=val.toFixed(2);
        else if(c.k==='change'){cl=val>=0?UP:DN;val=(val>0?'+':'')+val.toFixed(2);}
        else if(c.k==='cp'){cl=val>=0?UP:DN;val=(val>0?'+':'')+val.toFixed(2)+'%';}
        h+='<td style="padding:8px 12px;font-size:12px;text-align:'+(c.a||'l')+';'+(c.k==='code'?'font-family:\'JetBrains Mono\',monospace;font-size:11px;color:var(--text-tertiary)':'')+(cl?'color:'+cl+';font-family:\'JetBrains Mono\',monospace;font-variant-numeric:tabular-nums':'')+'">'+val+'</td>'});
      h+='</tr>'});
    h+='</tbody>';
    el.innerHTML=h;
  })();

  // ============ BADGES / CARDS ============
  (function(){
    var c1=UP,c2=DN,c3='#9e9e9e';
    document.getElementById('badge1').outerHTML='<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:5px;font-size:11px;font-weight:600;background:'+c1+'1e;color:'+c1+'">↑ +2.13%</span>';
    document.getElementById('badge2').outerHTML='<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:5px;font-size:11px;font-weight:600;background:'+c2+'1e;color:'+c2+'">↓ -1.34%</span>';
    document.getElementById('badge3').outerHTML='<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:5px;font-size:11px;font-weight:600;background:'+c3+'1e;color:'+c3+'">— 0.00%</span>';
    document.getElementById('pricedisplay1').outerHTML=
      '<div style="display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:8px;border:1px solid var(--border-sub);background:var(--bg-input);min-width:160px">'+
        '<span style="font-size:10px;color:var(--text-secondary);letter-spacing:.05em;text-transform:uppercase">紫金矿业</span>'+
        '<span style="font-size:22px;font-weight:700;font-family:\'JetBrains Mono\',monospace;color:'+c1+'">15.50</span>'+
        '<span style="font-size:12px;font-family:\'JetBrains Mono\',monospace;color:'+c1+'">+0.28 (+1.84%)</span>'+
        '<span style="font-size:10px;color:var(--text-tertiary)">开 15.38 / 高 15.55 / 低 15.20</span>'+
      '</div>';
    document.getElementById('stockcard1').outerHTML=
      '<div style="display:flex;flex-direction:column;gap:3px;padding:14px 18px;border-radius:10px;border:1px solid var(--border-sub);background:var(--bg-input);min-width:185px">'+
        '<div style="display:flex;align-items:center;gap:10px;justify-content:space-between">'+
          '<span style="font-weight:600;font-size:14px">紫金矿业</span>'+
          '<span style="font-size:10px;color:var(--text-tertiary);font-family:\'JetBrains Mono\',monospace">sh601899</span></div>'+
        '<div style="display:flex;align-items:baseline;gap:8px">'+
          '<span style="font-size:22px;font-weight:700;font-family:\'JetBrains Mono\',monospace;color:'+c1+'">15.50</span>'+
          '<span style="font-size:12px;font-family:\'JetBrains Mono\',monospace;color:'+c1+'">+1.84%</span></div>'+
        '<div style="display:flex;gap:16px;font-size:10px;color:var(--text-tertiary)">'+
          '<span>成交 2.56亿</span><span>换手 0.35%</span><span>市值 4,080亿</span></div>'+
      '</div>';
    document.getElementById('stockcard2').outerHTML=
